services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: svs
      POSTGRES_PASSWORD: svs
      POSTGRES_DB: svs
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-create-test-db.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
      image: chrislusf/seaweedfs
      command: server -dir=/data -s3 -s3.port=9000
      ports: ["9000:9000"]
      volumes: [miniodata:/data]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./backend:/app, ./db:/db:ro]  # /db: tests rebuild svs_test from db/init.sql
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -B -s /tmp/celerybeat-schedule --loglevel=info --concurrency=1
    env_file: .env
    volumes: [./backend:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  miniodata:
